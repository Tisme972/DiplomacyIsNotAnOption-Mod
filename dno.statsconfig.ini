# ================================================================
# DNO Stats Config Mod 2.0.0 - version standalone (sans BepInEx)
# Recompile pour Diplomacy is Not an Option v1.0.99_r
# Fichier place a cote de l'executable du jeu.
# Edite librement puis relance le jeu / recharge une partie.
# ================================================================

[General]
# Enable or disable all stat changes.
Enabled = true
# Also update entities that already exist when the system runs.
ApplyToExistingEntities = true
# Log each newly discovered unit/building stat key.
VerboseLogging = false

[Multipliers]
# Multiplier for player building max health.
BuildingHealthMultiplier = 1
# Multiplier for player army unit max health.
ArmyHealthMultiplier = 1
# Multiplier for player army unit damage.
ArmyDamageMultiplier = 1
# Multiplier for player army unit movement speed, acceleration, and rotation speed.
ArmySpeedMultiplier = 1

[Speed Multipliers]
# Multiplier for research progress speed.
ResearchSpeedMultiplier = 1
# Multiplier for player unit training speed.
UnitTrainingSpeedMultiplier = 1
# Multiplier for player building construction speed.
BuildingConstructionSpeedMultiplier = 1
# Multiplier for worker work output.
WorkerWorkSpeedMultiplier = 1
# Multiplier for worker movement speed, acceleration, and rotation speed.
WorkerMovementSpeedMultiplier = 1

[Range Multipliers]
# Multiplier for player unit maximum attack range.
UnitAttackRangeMultiplier = 1
# Multiplier for player unit fog reveal and target-search range.
UnitVisionRangeMultiplier = 1

[Resources]
# Make iron veins/mines never run out.
InfiniteIronSources = false
# Make fish food sources never run out. Berry bushes are not affected.
InfiniteFishSources = false
# Make stone sources never run out.
InfiniteStoneSources = false
# Current/max amount assigned to resource sources when an infinite resource option is enabled.
InfiniteResourceAmount = 1000000
# Starting amount for iron sources/mines. Set to 0 to keep the game default.
IronSourceStartingAmount = 0
# Starting amount for fisheries. Set to 0 to keep the game default. Berry bushes are not affected.
FishSourceStartingAmount = 0
# Starting amount for stone sources/mines. Set to 0 to keep the game default.
StoneSourceStartingAmount = 0
# Keep current food at least this high. Set to 0 to disable.
MinimumFood = 0
# Keep current money/gold at least this high. Set to 0 to disable.
MinimumMoney = 0
# Keep current wood at least this high. Set to 0 to disable.
MinimumWood = 0
# Keep current stone at least this high. Set to 0 to disable.
MinimumStone = 0
# Keep current iron at least this high. Set to 0 to disable.
MinimumIron = 0
# Keep current souls at least this high. Set to 0 to disable.
MinimumSouls = 0

[Resource Gain Multipliers]
# Multiplier for positive food gains. Does not multiply spending or this mod's minimum refill.
FoodGainMultiplier = 1
# Multiplier for positive money/gold gains. Does not multiply spending or this mod's minimum refill.
MoneyGainMultiplier = 1
# Multiplier for positive wood gains. Does not multiply spending or this mod's minimum refill.
WoodGainMultiplier = 1
# Multiplier for positive stone gains. Does not multiply spending or this mod's minimum refill.
StoneGainMultiplier = 1
# Multiplier for positive iron gains. Does not multiply spending or this mod's minimum refill.
IronGainMultiplier = 1
# Multiplier for positive souls gains. Does not multiply spending or this mod's minimum refill.
SoulsGainMultiplier = 1

[Capacities]
# Multiplier for granary food capacity. Ignored when GranaryCapacityOverride is greater than 0.
GranaryCapacityMultiplier = 1
# Exact granary food capacity. Set to 0 to use GranaryCapacityMultiplier. If greater than 0, this overrides the multiplier.
GranaryCapacityOverride = 0
# Multiplier for regular storage wood/stone/iron capacity. Ignored when StorageCapacityOverride is greater than 0.
StorageCapacityMultiplier = 1
# Exact regular storage wood/stone/iron capacity. Set to 0 to use StorageCapacityMultiplier. If greater than 0, this overrides the multiplier.
StorageCapacityOverride = 0
# Multiplier for house resident capacity. Ignored when HouseResidentsOverride is greater than 0.
HouseResidentsMultiplier = 1
# Exact house resident capacity. Set to 0 to use HouseResidentsMultiplier. If greater than 0, this overrides the multiplier.
HouseResidentsOverride = 0

[Advanced]
# Keep selected/player entities at their configured scaled health if the game refreshes them back to vanilla values.
EnforceHealthEveryTick = true

